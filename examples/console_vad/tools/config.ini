# ESP32-P4 FireRedVAD Configuration
# Central configuration for external tools (Python scripts)
# ONLY connection settings - NO firmware constants!

# ============================================================================
# Serial Port Configuration
# ============================================================================
[serial]
# Console/Debug UART (UART0) - for monitor and debug output
console_port = COM4
console_baud = 115200

# File Transfer UART (UART1) - for file protocol with hardware flow control
file_port = COM13
file_baud = 3000000

# ============================================================================
# Local PC Paths
# ============================================================================
[local_paths]
# Local directories for model management tools
frvd_models = frvd_models
pth_models = ../../pth_models

# NOTE: GPIO pins, SD card paths, and model file paths are defined in firmware
# (main/app_config.h) and queried dynamically via file protocol
